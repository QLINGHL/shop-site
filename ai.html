<style>
/* ===== 设计变量（与全站统一） ===== */
.shop-tokens{--font-body:Inter,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--bg:#f5f7fb;--surface:#fff;--surface-2:#f0f4f8;--text:#172033;--muted:#697487;--line:rgba(20,39,66,.11);--line-strong:rgba(20,39,66,.2);--accent:#12a89a;--accent-strong:#087f75;--accent-soft:rgba(18,168,154,.1);--accent-line:rgba(18,168,154,.35);--on-accent:#062c29;--shadow-soft:0 8px 28px rgba(31,51,79,.07);--shadow:0 20px 55px rgba(31,51,79,.11);--shadow-primary:0 10px 25px rgba(18,168,154,.18);--r-pill:999px}
.dark .shop-tokens,.dark.shop-tokens{--bg:#0b1120;--surface:#131b2e;--surface-2:#182136;--text:#e9eef6;--muted:#8f9ab2;--line:rgba(148,170,210,.13);--line-strong:rgba(148,170,210,.22);--accent:#2dd4bf;--accent-strong:#5eead4;--accent-soft:rgba(45,212,191,.12);--accent-line:rgba(45,212,191,.4);--on-accent:#03211c;--shadow-soft:0 8px 28px rgba(0,0,0,.4);--shadow:0 20px 55px rgba(0,0,0,.5);--shadow-primary:0 10px 25px rgba(45,212,191,.22)}
.dark{color-scheme:dark}
/* ===== 页面骨架 ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body.shop-tokens{background:var(--bg);color:var(--text)}
.ai-page{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;width:100%;padding:0 12px}
/* ===== 聊天区 ===== */
.ai-main{flex:1;overflow-y:auto;padding:28px 20px 16px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.ai-main::-webkit-scrollbar{width:5px}
.ai-main::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
/* 欢迎区：ChatGPT 式简洁居中 */
.ai-hero{text-align:center;padding:48px 16px 8px;animation:aiIn .5s cubic-bezier(.2,.8,.2,1)}
.ai-hero.hide{display:none}
.ai-hero-avatar{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#67dfd4);display:grid;place-items:center;box-shadow:var(--shadow-primary)}
.ai-hero-avatar svg{width:32px;height:32px;fill:#fff}
.ai-hero h1{margin:0 0 10px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.ai-hero p{margin:0 0 28px;color:var(--muted);font-size:15px;line-height:1.6}
.ai-suggest{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px;margin:0 auto}
.ai-card{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:10px 20px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text);box-shadow:var(--shadow-soft);transition:all .25s}
.ai-card:hover{transform:translateY(-2px);border-color:var(--accent-line);box-shadow:var(--shadow);color:var(--accent-strong)}
.ai-card b{font-weight:600}
/* 消息：ChatGPT 式 —— AI 无气泡纯文本，用户浅色气泡 */
.ai-msgs{display:flex;flex-direction:column;gap:22px;max-width:900px;margin:0 auto;width:100%}
.ai-row{display:flex;gap:14px;align-items:flex-start;animation:aiIn .35s cubic-bezier(.2,.8,.2,1)}
.ai-row.user{justify-content:flex-end}
@keyframes aiIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ai-avatar{width:32px;height:32px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),#67dfd4);display:grid;place-items:center;margin-top:2px}
.ai-avatar svg{width:17px;height:17px;fill:#fff}
.ai-bubble{font-size:15.5px;line-height:1.75;word-break:break-word;min-width:0}
.ai-row.ai .ai-bubble{color:var(--text);padding:2px 0;max-width:100%}
.ai-row.user .ai-bubble{max-width:min(75%,600px);padding:12px 18px;border-radius:22px;background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.ai-bubble.typing{display:flex;gap:6px;padding:8px 0;align-items:center}
.ai-bubble.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:aiBlink 1.2s infinite}
.ai-bubble.typing i:nth-child(2){animation-delay:.2s}
.ai-bubble.typing i:nth-child(3){animation-delay:.4s}
@keyframes aiBlink{0%,100%{opacity:.3}50%{opacity:1}}
/* ===== 输入区：ChatGPT 式大圆角输入框 ===== */
.ai-inputbar{padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent)}
.ai-inputwrap{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-strong);border-radius:28px;padding:10px 10px 10px 22px;box-shadow:var(--shadow-soft);transition:border-color .25s,box-shadow .25s}
.ai-inputwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-soft)}
.ai-inputwrap input{flex:1;min-width:0;border:0;background:none;outline:none;font:400 16px/1.5 var(--font-body);color:var(--text);padding:12px 0;resize:none}
.ai-inputwrap input::placeholder{color:var(--muted)}
.ai-send{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--text);cursor:pointer;display:grid;place-items:center;transition:transform .2s,opacity .2s,background .2s}
.ai-send:hover{transform:scale(1.06)}
.ai-send:active{transform:scale(.94)}
.ai-send:disabled{opacity:.25;cursor:default;transform:none}
.ai-send svg{width:17px;height:17px;fill:var(--bg);margin-left:1px}
.ai-note{max-width:900px;margin:10px auto 0;text-align:center;font-size:11px;color:var(--muted)}
@media(max-width:640px){
  .ai-hero h1{font-size:23px}
  .ai-hero{padding:32px 12px 8px}
  .ai-main{padding:20px 14px 12px}
  .ai-inputbar{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .ai-bubble{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .ai-hero-avatar,.ai-title .dot,.ai-row,.ai-hero{animation:none}
  .ai-card,.ai-back,.ai-send{transition:none}
}
</style>

var b=document.createElement('div');b.className='ai-bubble '+role;b.textContent=txt;row.appendChild(b);
msgs.appendChild(row);scrollDown();return row;}
function send(q){
var msg=(q!==undefined?q:text.value).trim();
if(!msg||sendBtn.disabled)return;
if(!started){started=true;hero.classList.add('hide');}
text.value='';addMsg('user',msg);
history.push({role:'user',content:msg});
var row=addMsg('ai','');var tp=row.querySelector('.ai-bubble');tp.classList.add('typing');tp.innerHTML='<i></i><i></i><i></i>';
sendBtn.disabled=true;
fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:msg,history:history.slice(-12)})})
.then(function(r){
if(!r.ok||!r.body)throw new Error('bad');
row.remove();sendBtn.disabled=false;
var bubbleRow=addMsg('ai','');var bp=bubbleRow.querySelector('.ai-bubble');
var reader=r.body.getReader();var dec=new TextDecoder();var buf='';var full='';
function pump(){
return reader.read().then(function(res){
if(res.done){finish();return;}
buf+=dec.decode(res.value,{stream:true});
var parts=buf.split('\n\n');buf=parts.pop();
for(var i=0;i<parts.length;i++){
var line=parts[i].trim();
if(line.indexOf('data:')!==0)continue;
var payload=line.slice(5).trim();
if(payload==='[DONE]'){finish();return;}
try{
var obj=JSON.parse(payload);
if(obj.delta){full+=obj.delta;bp.textContent=full;}
else if(obj.error){full=obj.error;bp.textContent=full;finish();return;}
}catch(e){}
}
return pump();
});
}
function finish(){
try{reader.cancel();}catch(e){}
history.push({role:'assistant',content:full||'抱歉，我暂时答不上来，换个问法试试？'});
if(history.length>24)history=history.slice(-24);
}
return pump();
})
.catch(function(){row.remove();sendBtn.disabled=false;addMsg('ai','网络开小差了，请稍后再试试。');});
}
sendBtn.addEventListener('click',function(){send();});
text.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
document.querySelectorAll('.ai-card').forEach(function(c){
c.addEventListener('click',function(){send(c.getAttribute('data-q'));});});
if(!/Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){text.focus();}
