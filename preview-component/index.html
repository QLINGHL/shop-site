<script>
(function () {
  var grid = document.querySelector('.sh-featured-grid');
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.sh-reveal'));
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io = null;

  function isPending(el) { return el.classList.contains('is-pending'); }
  function pendingCount() { return cards.filter(isPending).length; }

  function show(el) {
    var i = cards.indexOf(el);
    el.style.setProperty('--d', Math.min(i, 8) * 60 + 'ms');
    el.classList.remove('is-pending');
    el.classList.add('is-in');
  }

  function inView(el) {
    var r = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    return r.top < vh * 0.95 && r.bottom > 0;
  }

  function sweep() {
    cards.forEach(function (el) { if (isPending(el) && inView(el)) show(el); });
  }

  function arm() {
    if (io) { io.disconnect(); io = null; }

    // 重置为待入场
    cards.forEach(function (el) {
      el.classList.remove('is-in');
      el.style.removeProperty('--d');
      void el.offsetWidth;      // 强制回流，保证动画可重播
      el.classList.add('is-pending');
    });

    if (reduce) { cards.forEach(show); return; }

    // 首选 IntersectionObserver（与原站逻辑一致）
    if (typeof IntersectionObserver !== 'undefined') {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          show(e.target);
          io.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -5% 0px', threshold: 0.06 });
      cards.forEach(function (el) { el.dataset.reveal = '1'; io.observe(el); });
    }

    // 兜底：逐帧 + 滚动/缩放检测，任何环境下都能入场
    var t0 = Date.now();
    function loop() {
      sweep();
      if (pendingCount() && Date.now() - t0 < 4000) requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.addEventListener('scroll', sweep, { passive: true });
    window.addEventListener('resize', sweep);
  }

  arm();
})();
</script>
