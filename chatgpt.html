<style>
.shop-scope,body.shop-tokens{--font-body: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;--font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg: #f5f7fb;--surface: #ffffff;--surface-2: #f0f4f8;--surface-3: #e8eef4;--text: #172033;--muted: #697487;--line: rgba(20, 39, 66, .11);--line-strong: rgba(20, 39, 66, .2);--accent: #12a89a;--accent-strong: #087f75;--accent-soft: rgba(18, 168, 154, .1);--accent-line: rgba(18, 168, 154, .35);--on-accent: #062c29;--amber: #c68416;--amber-soft: rgba(214, 151, 38, .12);--red: #d84a5a;--red-soft: rgba(216, 74, 90, .1);--blue: #2769a8;--blue-soft: #eaf4ff;--orange: #a26012;--orange-soft: #fff2dc;--gold: #b87513;--dot: #f04455;--link: #1677ff;--promo-grad: linear-gradient(135deg, #fff0ca, #ffe0ed);--promo-grad-hover: linear-gradient(135deg, #ffe3a0, #ffcbdc);--promo-text: #b64a28;--promo-text-hover: #9e351d;--promo-line: rgba(222, 125, 61, .25);--promo-shadow: 0 6px 18px rgba(216, 112, 62, .1);--shadow: 0 20px 55px rgba(31, 51, 79, .11);--shadow-soft: 0 8px 28px rgba(31, 51, 79, .07);--shadow-mark: 0 9px 22px rgba(18, 168, 154, .2);--shadow-primary: 0 10px 25px rgba(18, 168, 154, .18);--shadow-pop: 0 24px 70px rgba(15, 28, 50, .2);--header: rgba(255, 255, 255, .9);--site-header-height: 72px;--r-icon: 11px;--r-mark: 12px;--r-nav: 9px;--r-search: 13px;--r-panel: 17px;--r-item: 11px;--r-logo: 10px;--r-card: 18px;--r-card-m: 13px;--r-pill: 999px;--r-toast: 14px;--ui-bg-page: var(--bg);--ui-bg-elevated: var(--surface);--ui-bg-soft: var(--surface-2);--ui-bg-muted: var(--surface-3);--ui-bg-overlay: color-mix(in srgb, var(--surface) 80%, transparent);--ui-bg-overlay-strong: color-mix(in srgb, var(--surface) 92%, transparent);--ui-text-primary: var(--text);--ui-text-secondary: #3d4859;--ui-text-muted: var(--muted);--ui-text-on-accent: var(--on-accent);--ui-border: var(--line);--ui-border-strong: var(--line-strong);--ui-accent: var(--accent);--ui-accent-hover: var(--accent-strong);--ui-accent-soft: var(--accent-soft);--ui-accent-warm: var(--amber);--ui-accent-warm-hover: #a26012;--ui-accent-warm-soft: var(--amber-soft);--ui-success: var(--accent-strong);--ui-success-soft: var(--accent-soft);--ui-warning: var(--amber);--ui-warning-soft: var(--amber-soft);--ui-danger: var(--red);--ui-danger-soft: var(--red-soft);--ui-info: var(--blue);--ui-info-soft: var(--blue-soft);--ui-focus-ring: var(--accent-soft);--ui-radius-sm: var(--r-icon);--ui-radius-md: var(--r-search);--ui-radius-lg: var(--r-panel);--ui-radius-xl: 22px;--ui-shadow-1: var(--shadow-soft);--ui-shadow-2: var(--shadow-soft);--ui-shadow-3: var(--shadow);--ui-shadow-soft: var(--shadow-soft);--ui-shadow-card: var(--shadow);--ui-price-primary: var(--text);--ui-price-promotion: var(--red);--ui-price-original: var(--muted)}
.shop-scope .sh-fart.is-chatgpt{background:radial-gradient(ellipse at 50% 62%,var(--accent-soft),transparent 68%)}
.shop-scope .fa-gpt{display:grid;place-items:center;animation:fa-gpt-float 6.4s ease-in-out infinite}
/* ---- ChatGPT：一张会员卡内列出三档套餐（三档价格同屏可对比） ---- */@keyframes fa-gpt-float{0%,100%{transform:rotate(-3.5deg) translateY(4px)}50%{transform:rotate(-1.5deg) translateY(-6px)}}
.shop-scope .fa-gpt-card{position:relative;width:238px;height:146px;display:flex;flex-direction:column;padding:16px 18px;border-radius:18px;overflow:hidden;color:#fff;background:linear-gradient(150deg,#30343b,#0c0d10 58%,#1e2025);box-shadow:0 24px 44px #0000004d,inset 0 1px #ffffff24;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.shop-scope .sh-fcard:hover .fa-gpt-card{transform:translateY(-5px) scale(1.025);box-shadow:0 32px 56px #0000005e,inset 0 1px #ffffff2e}
/* 会员卡品牌色：与首页 ChatGPT 卡一致（白卡面+深色字） */
.shop-scope .buy-stage .fa-gpt-card{background:linear-gradient(150deg,#ffffff,#eef2f0 70%,#e2e9e4);color:#1b2b24;box-shadow:0 24px 44px rgba(23,42,34,.16),inset 0 1px #ffffff}
.shop-scope .buy-stage .fa-gpt-head{border-bottom-color:rgba(27,43,36,.14)}
.shop-scope .buy-stage .fa-gpt-head span{color:rgba(27,43,36,.55)}
.shop-scope .buy-stage .fa-gpt-plan small{color:rgba(27,43,36,.6)}
.shop-scope .buy-stage .fa-gpt-plan.is-on{background:rgba(27,43,36,.07);box-shadow:inset 0 0 0 1px rgba(27,43,36,.14)}
.shop-scope .buy-stage .fa-gpt-plan.is-on em{color:#1b2b24;text-shadow:0 0 16px rgba(27,43,36,.22)}
.shop-scope .buy-stage .fa-gpt-plan.is-on small{color:rgba(27,43,36,.85)}

/* 套餐按钮 */
.buy-plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  padding:14px 16px 13px;border:1.5px solid var(--line);border-radius:17px;background:var(--surface);
  cursor:pointer;text-align:left;transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}
.buy-plan:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.buy-plan.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
/* 右下角 OpenAI 水印 */.shop-scope .fa-gpt-watermark{position:absolute;right:-22px;bottom:-28px;width:120px;height:120px;opacity:.06;pointer-events:none}
.shop-scope .fa-gpt-head{position:relative;display:flex;align-items:center;gap:7px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.13)}
.shop-scope .fa-gpt-head svg{width:19px;height:19px}
.shop-scope .fa-gpt-head b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.shop-scope .fa-gpt-head span{margin-left:auto;font-size:8px;font-weight:700;letter-spacing:.1em;color:#ffffff80}
.shop-scope .fa-gpt-plans{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.shop-scope .fa-gpt-plan{display:flex;align-items:baseline;justify-content:space-between;gap:12px;line-height:1.1}
.shop-scope .fa-gpt-plan small{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:#ffffff8c}
.shop-scope .fa-gpt-plan em{font-size:19px;font-style:normal;font-weight:750;letter-spacing:.01em;font-variant-numeric:tabular-nums}

@keyframes fa-sheen{0%,22%{opacity:0;transform:translate(-60%)}28%{opacity:1}56%{opacity:1;transform:translate(60%)}62%,to{opacity:0;transform:translate(60%)}}

/* ============ ChatGPT 购买页 ============ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
h1,h2,p,ul{margin:0}

.buy-page{min-height:100vh;padding:0 20px 64px;position:relative;overflow-x:hidden}
/* 背景光晕 */
.buy-page::before{content:"";position:fixed;left:50%;top:-220px;width:900px;height:620px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 50%,rgba(18,168,154,.10),transparent 66%);pointer-events:none;z-index:0}
.buy-inner{position:relative;z-index:1;max-width:1060px;margin:0 auto}

/* --- 顶栏 --- */
.buy-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 16px}
/* 返回按钮：44px 触屏点按高度 + 高对比文字 + 明确的可点反馈 */
.buy-back{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 18px 0 12px;
  border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--text);
  font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  box-shadow:var(--shadow-soft);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .25s,border-color .25s,color .25s,transform .25s,box-shadow .25s}
.buy-back i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--surface-2);color:var(--muted);
  transition:background .25s,color .25s,transform .25s}
.buy-back svg{width:14px;height:14px}
.buy-back:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong);
  transform:translateY(-1px);box-shadow:0 10px 24px rgba(18,168,154,.16)}
.buy-back:hover i{background:var(--accent);color:#fff;transform:translateX(-2px)}
.buy-back:active{transform:translateY(0) scale(.985)}
.buy-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* --- 主区 --- */
.buy-hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:30px;align-items:center;
  padding:34px;border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}

/* 左侧：卡片舞台 */
.buy-stage{position:relative;min-height:292px;display:grid;place-items:center;border-radius:22px;
  background:radial-gradient(ellipse at 50% 62%,rgba(15,23,42,.075),transparent 68%)}
.buy-stage .fa-gpt{scale:1.42}
/* 购买页把卡片摆正：选中的高亮条才是干净的水平条，不会跟着倾斜 */
.shop-scope .buy-stage .fa-gpt{animation:buy-card-float 5.4s ease-in-out infinite}
@keyframes buy-card-float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-6px)}}
/* 卡片上"已选"那一行的高亮 */
.buy-stage .fa-gpt-plan{border-radius:10px;padding:0 10px;margin:0 -10px;transition:background .35s,box-shadow .35s}
.buy-stage .fa-gpt-plan.is-on{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.buy-stage .fa-gpt-plan.is-on em{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.4)}
.buy-stage .fa-gpt-plan.is-on small{color:#ffffffcc}
.buy-stage .fa-gpt-plan em{transition:color .35s,text-shadow .35s}
.buy-stage .fa-gpt-plan small{transition:color .35s}

/* 右侧：信息与下单 */
.buy-eyebrow{display:block;color:var(--accent-strong);font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.buy-title{margin:7px 0 0;font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.buy-sub{margin:7px 0 0;color:var(--muted);font-size:13px}

.buy-plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:22px 0 0}
.buy-plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  padding:14px 16px 13px;border:1.5px solid var(--line);border-radius:17px;background:var(--surface);
  cursor:pointer;text-align:left;transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}
.buy-plan:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.buy-plan b{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.02em;white-space:nowrap}
.buy-plan em{font-size:22px;font-style:normal;font-weight:800;letter-spacing:-.02em;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.1}
.buy-plan small{font-size:10px;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.buy-plan.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.buy-plan.is-active em{color:var(--accent-strong)}
/* 勾选标记 */
.buy-plan::after{content:"";position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--line-strong);transition:background .25s,border-color .25s}
.buy-plan.is-active::after{border-color:var(--accent);background:var(--accent);
  box-shadow:inset 0 0 0 3.5px var(--surface)}

.buy-total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 0 0;
  padding:16px 0 0;border-top:1px dashed var(--line-strong)}
.buy-total span{font-size:12px;color:var(--muted);padding-bottom:5px}
.buy-total strong{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;transition:transform .2s}
.buy-total strong.tick{animation:buy-tick .35s cubic-bezier(.2,.8,.2,1)}
@keyframes buy-tick{0%{transform:translateY(6px) scale(.94);opacity:.35}100%{transform:none;opacity:1}}

.buy-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:16px 0 0;padding:15px;
  border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-primary);
  transition:transform .25s,box-shadow .25s,filter .25s}
.buy-cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(18,168,154,.32);filter:saturate(1.06)}
.buy-cta:active{transform:translateY(0)}
.buy-cta svg{width:16px;height:16px}

.buy-trust{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0;padding:0;list-style:none}
.buy-trust li{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600}
.buy-trust svg{width:12px;height:12px;color:var(--accent-strong)}

/* --- 提示 --- */
.buy-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:60;
  display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;
  background:var(--text);color:#fff;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-pop);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.buy-toast.is-on{opacity:1;transform:translate(-50%,0)}
.buy-toast svg{width:15px;height:15px}

/* --- 响应式 --- */
@media(max-width:880px){
  .buy-hero{grid-template-columns:minmax(0,1fr);padding:24px;gap:20px}
  .buy-stage{min-height:250px}
  .buy-stage .fa-gpt{scale:1.22}
  .buy-title{font-size:26px}
}
@media(max-width:560px){
  .buy-plans{grid-template-columns:minmax(0,1fr)}
  .buy-plan{flex-direction:row;align-items:baseline;justify-content:space-between;gap:10px;padding-right:44px}
  .buy-plan small{display:none}
  .buy-stage .fa-gpt{scale:1.05}
  .buy-total strong{font-size:27px}
}
@media (prefers-reduced-motion: reduce){
  .buy-stage .fa-gpt{animation:none;transform:none}
}


/* ===== 深色主题 ===== */
.dark body.shop-tokens,.dark .shop-scope{--bg:#0b1120;--surface:#131b2e;--surface-2:#182136;--surface-3:#1f2940;--text:#e9eef6;--muted:#8f9ab2;--line:rgba(148,170,210,.13);--line-strong:rgba(148,170,210,.22);--accent:#2dd4bf;--accent-strong:#5eead4;--accent-soft:rgba(45,212,191,.12);--accent-line:rgba(45,212,191,.4);--on-accent:#03211c;--header:rgba(11,17,32,.9);--shadow:0 20px 55px rgba(0,0,0,.5);--shadow-soft:0 8px 28px rgba(0,0,0,.4);--shadow-mark:0 9px 22px rgba(45,212,191,.25);--shadow-primary:0 10px 25px rgba(45,212,191,.22);--shadow-pop:0 24px 70px rgba(0,0,0,.55);--ui-text-secondary:#b9c3d6}.dark{color-scheme:dark}
.dark .shop-scope .sh-fcard.is-x .fa-x-card{border:1px solid rgba(255,255,255,.14)}
/* ===== 主题切换开关 ===== */
.shop-scope .sh-theme{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);flex:none}
.shop-scope .sh-theme button{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--font-body);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.shop-scope .sh-theme button.is-on{background:var(--surface);color:var(--text);box-shadow:0 1px 5px rgba(8,15,30,.25)}
.shop-scope .buy-header .sh-theme{margin-left:auto}
@media(max-width:760px){.shop-scope .sh-theme button{padding:6px 9px;font-size:11px}}</style>

<body class="shop-tokens">
<!-- SHOP-SIDEBAR -->
<style>

.shop-sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:9000;display:flex;flex-direction:column;background:var(--surface,#fff);border-right:1px solid var(--line,rgba(20,39,66,.11));padding:20px 14px 16px;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
/* Logo 行 */
.shop-sb-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

.shop-sb-logo .mark{width:44px;height:44px;flex:none;border-radius:13px;overflow:hidden;transition:transform .25s}

.shop-sb-logo .mark img{width:100%;height:100%;display:block;object-fit:cover}
.shop-sb-logo b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.collapse-btn{display:grid;place-items:center;width:32px;height:32px;flex:none;border:0;border-radius:10px;background:none;color:var(--muted,#697487);cursor:pointer;transition:background .2s,color .2s}

.shop-sb-nav{display:flex;flex-direction:column;gap:8px}

.shop-sb-pill svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.shop-sb-pill:hover{background:var(--surface-2,#eef2f6);color:var(--text,#172033)}
.shop-sb-pill:hover svg{transform:scale(1.08)}

.shop-sb-pill.is-on{background:var(--accent-soft,rgba(18,168,154,.13));color:var(--accent-strong,#087f75);box-shadow:inset 0 0 0 1px rgba(18,168,154,.22)}
.dark .shop-sb-pill.is-on{color:#5eead4}
/* 隐藏态：侧边栏整个滑出 */
body.sb-hidden .shop-sidebar{transform:translateX(-105%)}

.shop-sb-expand:hover{color:var(--text,#172033)}
.shop-sb-expand:active{transform:scale(.94)}

/* ===== 移动端底部选项卡（替代侧边栏） ===== */
.shop-tabbar{display:none}

  body.has-shop-sidebar{padding-left:20px}

<script>
(function () {
  var plans = Array.prototype.slice.call(document.querySelectorAll('.buy-plan'));
  var rows  = Array.prototype.slice.call(document.querySelectorAll('.buy-stage .fa-gpt-plan'));
  var amount = document.getElementById('amount');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;

  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-on'); }, 2200);
  }

  function pick(plan) {
    plans.forEach(function (p) { p.classList.toggle('is-active', p === plan); });
    var key = plan.dataset.plan;
    rows.forEach(function (r) { r.classList.toggle('is-on', r.dataset.plan === key); });
    amount.textContent = plan.dataset.price;
    var box = amount.parentNode;
    box.classList.remove('tick');
    void box.offsetWidth;
    box.classList.add('tick');
  }

  plans.forEach(function (p) {
    p.addEventListener('click', function () { pick(p); });
  });

  document.getElementById('cta').addEventListener('click', function () {
    var active = document.querySelector('.buy-plan.is-active');
    showToast('已选择 ' + active.dataset.plan + ' · 应付 ¥' + active.dataset.price);
  });

  pick(plans[0]);
})();
</script>
