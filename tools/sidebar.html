<!-- SHOP-SIDEBAR -->
<style>
/* ===== 全站左侧边栏 v5（胶囊导航：商品 / AI 客服 / 设置） ===== */
.shop-sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:9000;display:flex;flex-direction:column;background:var(--surface,#fff);border-right:1px solid var(--line,rgba(20,39,66,.11));padding:20px 14px 16px;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
/* Logo 行 */
.shop-sb-toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
a.shop-sb-logo{display:flex;align-items:center;gap:10px;padding:2px 6px;text-decoration:none;color:var(--text,#172033)}
.shop-sb-logo .mark{width:44px;height:44px;flex:none;border-radius:13px;overflow:hidden;transition:transform .25s}
a.shop-sb-logo:hover .mark{transform:scale(1.05)}
.shop-sb-logo .mark img{width:100%;height:100%;display:block;object-fit:cover}
.shop-sb-logo b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.collapse-btn{display:grid;place-items:center;width:32px;height:32px;flex:none;border:0;border-radius:10px;background:none;color:var(--muted,#697487);cursor:pointer;transition:background .2s,color .2s}
.collapse-btn:hover{background:var(--surface-2,#f0f4f8);color:var(--text,#172033)}
.collapse-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 胶囊导航 */
.shop-sb-nav{display:flex;flex-direction:column;gap:8px}
.shop-sb-pill{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;color:var(--muted,#697487);font-size:14px;font-weight:600;text-decoration:none;transition:background .2s,color .2s,transform .15s}
.shop-sb-pill svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.shop-sb-pill:hover{background:var(--surface-2,#eef2f6);color:var(--text,#172033)}
.shop-sb-pill:hover svg{transform:scale(1.08)}
.shop-sb-pill:active{transform:scale(.98)}
.shop-sb-pill.is-on{background:var(--accent-soft,rgba(18,168,154,.13));color:var(--accent-strong,#087f75);box-shadow:inset 0 0 0 1px rgba(18,168,154,.22)}
.dark .shop-sb-pill.is-on{color:#5eead4}
/* 隐藏态：侧边栏整个滑出 */
body.sb-hidden .shop-sidebar{transform:translateX(-105%)}
/* 主内容区让位：body 内边距方案，不破坏内部 max-width 居中 */
body.has-shop-sidebar{padding-left:248px}
body.sb-hidden.has-shop-sidebar{padding-left:0}
/* 左上角展开浮钮 */
.shop-sb-expand{display:none;position:fixed;left:14px;top:14px;z-index:9001;width:42px;height:42px;border-radius:14px;border:1px solid var(--line,rgba(20,39,66,.11));background:var(--surface,#fff);color:var(--muted,#697487);cursor:pointer;box-shadow:0 8px 24px rgba(15,28,50,.14);place-items:center;transition:color .2s,transform .15s}
.shop-sb-expand:hover{color:var(--text,#172033)}
.shop-sb-expand:active{transform:scale(.94)}
.shop-sb-expand svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.sb-hidden .shop-sb-expand{display:grid}
@media(max-width:1023.98px){.shop-sb-expand{display:none!important}}
/* ===== 移动端底部选项卡（替代侧边栏） ===== */
.shop-tabbar{display:none}
@media(max-width:1023.98px){
  body.has-shop-sidebar{padding-left:20px}
  /* 侧边栏及抽屉在移动端彻底隐藏 */
  .shop-sidebar,.shop-sb-toggle,.shop-sb-expand,.shop-sb-mask{display:none!important}
  /* 底部胶囊选项卡 */
  .shop-tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9000;background:var(--surface,#fff);border:1px solid var(--line,rgba(20,39,66,.11));border-radius:28px;box-shadow:0 12px 40px rgba(15,28,50,.18);padding:8px 6px}
  .shop-tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;color:var(--muted,#697487);font-size:11px;font-weight:600;text-decoration:none;transition:background .2s,color .2s}
  .shop-tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .shop-tabbar a:active{transform:scale(.96)}
  .shop-tabbar a.is-on{color:var(--accent-strong,#087f75);background:var(--accent-soft,rgba(18,168,154,.13))}
  .dark .shop-tabbar a.is-on{color:#5eead4}
  /* 给底部选项卡留出空间 */
  body.has-shop-sidebar{padding-bottom:96px}
  /* AI 聊天页是 100dvh 固定高度，单独留出选项卡位置，避免输入框被盖住 */
  .ai-page{height:calc(100dvh - 104px)!important}
}
@media (prefers-reduced-motion:reduce){.shop-sidebar,.shop-sb-pill,.shop-tabbar a{transition:none}}
</style>
<button class="shop-sb-expand" id="shopExpandBtn" aria-label="展开侧边栏"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/><path d="M13.5 12l2.5-2.5M13.5 12l2.5 2.5" stroke-width="1.6"/></svg></button>

    <a class="shop-sb-pill" data-sb="chat" href="ai.html"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span>AI 客服</span></a>
    <a class="shop-sb-pill" data-sb="settings" href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span></a>
  </nav>
</aside>
<nav class="shop-tabbar" aria-label="底部导航">
  <a data-sb="shop" href="index.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>商品</span></a>
  <a data-sb="chat" href="ai.html"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg><span>AI 客服</span></a>
  <a data-sb="settings" href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1 4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span></a>
</nav>
<script>(function(){
document.body.classList.add('has-shop-sidebar');
var p=location.pathname.split('/').pop()||'index.html';
var cur='shop';
if(p.indexOf('ai')===0)cur='chat';
else if(p.indexOf('settings')===0)cur='settings';
else if(p.indexOf('chatgpt')===0||p.indexOf('x-premium')===0)cur='shop';
var els=document.querySelectorAll('[data-sb]');
for(var i=0;i<els.length;i++)els[i].classList.toggle('is-on',els[i].getAttribute('data-sb')===cur);
/* 收起/展开（桌面端） */
var HK='shop-sb-hidden';
function setHidden(o){document.body.classList.toggle('sb-hidden',o);try{localStorage.setItem(HK,o?'1':'0')}catch(e){}}
try{
var _h=localStorage.getItem(HK);
if(_h===null&&localStorage.getItem('shop-sb-collapsed')==='1')_h='1';
if(_h==='1'&&window.innerWidth>1023)document.body.classList.add('sb-hidden');
}catch(e){}
var cb=document.getElementById('shopCollapseBtn');
if(cb)cb.addEventListener('click',function(){setHidden(true)});
var eb=document.getElementById('shopExpandBtn');
if(eb)eb.addEventListener('click',function(){setHidden(false)});
/* 主题（设置页） */
var K='shop-theme';
function sysD(){return window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches}
function mode(){try{return localStorage.getItem(K)||'auto'}catch(e){return'auto'}}
function apply(){var m=mode();var d=m==='dark'||(m==='auto'&&sysD());document.documentElement.classList.toggle('dark',d);var b=document.querySelectorAll('#setThemes [data-theme],#shopSetThemes [data-theme]');for(var i=0;i<b.length;i++)b[i].classList.toggle('is-on',b[i].getAttribute('data-theme')===m)}
function init(){apply();var b=document.querySelectorAll('#setThemes [data-theme],#shopSetThemes [data-theme]');for(var i=0;i<b.length;i++)(function(x){x.addEventListener('click',function(){try{localStorage.setItem(K,x.getAttribute('data-theme'))}catch(e){}apply()})})(b[i]);var mq=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)');if(mq){var f=function(){if(mode()==='auto')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();</script>
